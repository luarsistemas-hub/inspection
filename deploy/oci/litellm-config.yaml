model_list:
  - model_name: inspection-vision
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/LLM_API_KEY
  - model_name: inspection-video-preparation
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/LLM_API_KEY
  - model_name: inspection-video-matching
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/LLM_API_KEY
  # Dedicated aliases used by audio transcription profiles.
  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/LLM_API_KEY
      timeout: 40
  - model_name: gemini-2.0-flash-lite
    litellm_params:
      model: gemini/gemini-2.0-flash-lite
      api_key: os.environ/LLM_API_KEY
      timeout: 40
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/LLM_API_KEY
      timeout: 40

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  num_retries: 0

litellm_settings:
  request_timeout: 25
