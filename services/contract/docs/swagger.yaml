basePath: /
definitions:
  CreateContractRequest:
    properties:
      accountId:
        format: uuid
        type: string
      clientId:
        format: uuid
        type: string
      photos:
        items:
          type: string
        type: array
      productId:
        format: uuid
        type: string
      tenantId:
        format: uuid
        type: string
    required:
    - accountId
    - clientId
    - tenantId
    - productId
    type: object
  CreateContractResponse:
    properties:
      contractId:
        format: uuid
        type: string
    type: object
  ErrorResponse:
    properties:
      error:
        type: string
    type: object
host: localhost:4000
info:
  description: Contract Service API
  title: Contract Service API
  version: "1.0"
paths:
  /create-contract:
    post:
      consumes:
      - application/json
      description: Creates a contract from the supplied account, client, tenant and product IDs.
      parameters:
      - description: Contract data
        in: body
        name: contract
        required: true
        schema:
          $ref: '#/definitions/CreateContractRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CreateContractResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Storage failure
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create a contract
schemes:
- http
swagger: "2.0"
