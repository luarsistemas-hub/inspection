schema:
  - schema.graphqls
exec:
  filename: internal/platform/graphql/generated.go
model:
  filename: internal/platform/graphql/models_gen.go
models:
  Query:
    fields:
      inspectionCoverage:
        resolver: true
      llmUsageByTenant:
        resolver: true
      llmUsageByInspection:
        resolver: true
  Mutation:
    fields:
      recordComponentAnswer:
        resolver: true
      upsertHandoverRecord:
        resolver: true
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Map
  Report:
    fields:
      evidence:
        resolver: true
  OriginVersion:
    fields:
      counterpartyInvitations:
        resolver: true
  Inspection:
    fields:
      scope:
        resolver: true
resolver:
  layout: follow-schema
  dir: internal/platform/graphql/resolvers
