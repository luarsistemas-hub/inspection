query DashboardOverview($first: Int!) {
  me { identityId tenantId roles memberships { id tenantId role status version scopes { kind resourceId } } }
  tenant { id name language defaultTimezone status version }
  memberships(first: $first) { nodes { id tenantId role status version scopes { kind resourceId } } pageInfo { endCursor hasNextPage } }
  businessUnits(first: $first) { nodes { id code name status version } pageInfo { endCursor hasNextPage } }
  participants(first: $first) { nodes { id name segmentRole status businessUnitId version contacts { id channel value verified active } selectedContactIds } }
  segmentDefinitions(first: $first) { nodes { id key name activeVersionId version } }
  templates(first: $first) { nodes { id key name activeVersionId version } }
  assets(first: $first) { nodes { id name externalKey address status businessUnitId version segmentVersionId templateId latitudeE6 longitudeE6 geofenceMeters assignments { participantId role active } } }
  schedules(first: $first) { nodes { id assetId participantId templateId referenceVersionId rrule timezone startsAt status nextDueAt deadlineMinutes reminderOffsetsMinutes version } }
  projects(first: $first) { nodes { id assetId participantId templateId templateVersionId status reportMode version stages { id key label kind position status plannedAt inspectionId version } transitions { id stageId fromState toState reason occurredAt } } }
  inspections(first: $first) { nodes { id assetId participantId templateId templateVersionId analysisProfileVersionId projectId source sourceReason stateReason status evidenceCount dueAt deadlineAt reminderInstants version } }
  auditEvents(first: $first) { nodes { id action targetType targetId outcome reason correlationId occurredAt } }
  notificationDeliveries(first: $first) { nodes { id intentId status createdAt updatedAt } }
  retentionPolicies { nodes { id evidenceDays operationalDays securityDays version createdAt updatedAt } }
  usageSummary { from to requests inputTokens outputTokens cost }
  dashboardSummary { total normal attention critical pending invalidated }
  triageInspections(first: $first) {
    nodes { inspectionId projectId assetId classification status updatedAt }
    pageInfo { endCursor hasNextPage }
  }
}

