query Report($inspectionId: ID!, $version: Int) {
  report(inspectionId: $inspectionId, version: $version) { id inspectionId projectId version mode classification jsonDigest htmlDigest canonicalJSON html createdAt }
}

query ReportDownload($snapshotId: ID!, $kind: String!) {
  reportDownload(snapshotId: $snapshotId, kind: $kind) { snapshotId kind objectKey url status sha256 }
}

query ProjectTimeline($projectId: ID!) {
