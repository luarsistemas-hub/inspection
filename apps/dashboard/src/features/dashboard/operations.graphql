mutation InviteOriginCapture($input: InviteOriginCaptureInput!) { inviteOriginCapture(input: $input) { invitationId originVersionId status userErrors { code field message correlationId } clientMutationId } }
mutation ActivateOriginVersion($input: OriginVersionInput!) { activateOriginVersion(input: $input) { version { id status versionNumber mediaKind preparationStatus selectable sourceAvailability } userErrors { code field message correlationId } clientMutationId } }
