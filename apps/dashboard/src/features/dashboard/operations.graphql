query DashboardGate {
  me { tenantId productEntitlements roles effectiveScopes { kind resourceId } }
  tenant { id name status }
}

query DashboardMemberships {
  me { memberships { id tenantId name email role status } }
}

query DashboardReviewers($first: Int!, $after: String) {
  memberships(first: $first, after: $after) { nodes { id tenantId name email role status scopes { kind resourceId } } pageInfo { endCursor hasNextPage } }
}

query DashboardFormOptions($first: Int!, $assetSearch: String, $assetAfter: String, $participantSearch: String, $participantAfter: String, $templateSearch: String, $templateAfter: String) {
  assets(first: $first, search: $assetSearch, after: $assetAfter) { nodes { id name externalKey businessUnitId segmentVersionId templateId status version } pageInfo { endCursor hasNextPage } }
  participants(first: $first, search: $participantSearch, after: $participantAfter) { nodes { id businessUnitId name status } pageInfo { endCursor hasNextPage } }
  templates(first: $first, search: $templateSearch, after: $templateAfter) { nodes { id key name segmentVersionId activeVersionId version } pageInfo { endCursor hasNextPage } }
}
query DashboardBaselineAsset($id: ID!) { asset(id: $id) { id name externalKey businessUnitId } }
query DashboardBaselineAssets($after: String) { assets(first: 100, after: $after) { nodes { id name externalKey businessUnitId segmentVersionId templateId status version } pageInfo { endCursor hasNextPage } } }
query DashboardCounterpartyOptions($after: String) { participants(first: 100, after: $after) { nodes { id businessUnitId name status } pageInfo { endCursor hasNextPage } } }
query DashboardCustomerBaselineAssets($after: String) { customerPortfolio(first: 100, after: $after) { nodes { assetId assetName assetExternalKey status progress updatedAt } pageInfo { endCursor hasNextPage } } }
query DashboardOriginVersions($assetId: ID!) { originVersions(assetId: $assetId, first: 100) { nodes { id originId versionNumber status mediaKind preparationStatus captureSubmitted selectable source sourceInspectionId draftState sourceAvailability limitedCoverage scopeManifestDigest supersedesId activatedAt purpose hasInventory } pageInfo { endCursor hasNextPage } } }
query DashboardTemplateVersion($id: ID!) { templateVersion(id: $id) { id mediaKind isVideo } }

query DashboardBaselineVersions($assetId: ID!) {
  baselineVersions(assetId: $assetId, first: 100) { nodes { id originId versionNumber status mediaKind activatedAt activatedBy purpose source sourceInspectionId hasInventory draftState sourceAvailability counts { included rejected notReviewed } contestationSummary { pending acknowledged contested open noResponse } counterpartyInvitations { id participantId response deadlineAt respondedAt statement resolution resolutionReason adjustmentVersionId deliveryStatus deliveryId } } pageInfo { endCursor hasNextPage } }
}
query DashboardInventoryDraft($originVersionId: ID!) {
  inventoryDraft(originVersionId: $originVersionId) { assetId version { id originRevision versionNumber status draftState hasInventory purpose counts { included rejected notReviewed } } progress { decided pending } readOnly noticeCode warnings environments { id identityId typeCode name expected addedDuringCapture decision position items { id identityId environmentId typeCode name material color quantity condition observation limitation confidenceBps origin declared decision rejectionReason version evidence { id kind mediaId frameId timestampMs url position availability retentionAvailability } } } }
}
query DashboardBaselineInventory($assetId: ID!, $versionId: ID) {
  baselineInventory(assetId: $assetId, versionId: $versionId) { hasInventory version { id versionNumber status purpose activatedAt sourceAvailability } environments { id typeCode name expected addedDuringCapture items { id typeCode name material color quantity condition observation limitation declared decision evidence { id kind mediaId frameId timestampMs url availability retentionAvailability } } } }
}
query DashboardInventoryTrail($originVersionId: ID!) { inventoryTrail(originVersionId: $originVersionId) { suggestions { id targetType targetId action before after reason statement resolutionReason actorMembershipId occurredAt } decisions { id targetType targetId action before after reason statement resolutionReason actorMembershipId occurredAt } counterpartyEvents { id targetType targetId action before after reason statement resolutionReason actorMembershipId occurredAt } } }

query OperationalOverview($after: String, $classification: String, $status: String) {
  dashboardSummary { total normal attention critical pending invalidated }
  triageInspections(first: 25, after: $after, classification: $classification, status: $status) {
    nodes { inspectionId projectId assetId classification status updatedAt }
    pageInfo { endCursor hasNextPage }
  }
}

query TriageWorkspace($first: Int, $after: String, $status: TriageReviewStatus, $classification: String, $search: String, $assigneeId: ID, $reason: String) {
  triageWorkspace(first: $first, after: $after, status: $status, classification: $classification, search: $search, assigneeId: $assigneeId, reason: $reason) {
    counts { new inReview awaitingEvidence criticalOpen }
    nodes { inspectionId assetId assetName address classification status reviewStatus assigneeId reportVersion version findingCount reasonCodes createdAt updatedAt }
    pageInfo { endCursor hasNextPage }
  }
}
query TriageCase($inspectionId: ID!) {
  triageCase(inspectionId: $inspectionId) {
    inspectionId assetId assetName address classification status reviewStatus assigneeId reportVersion version reasonCodes createdAt updatedAt
    report { id version classification advisory context { asset { name address } participant { name } inspection { generatedAt } } requirements { key label analysisStatus coverage impossibilityReason } findings { id title category description severity confidence quality recommendedAction evidenceIds } evidence(first: 100) { nodes { id requirementKey role description capturedAt availability flags url evidenceKind frameId timestampMs ptsMicros preparationId planId sourceMediaId component label } pageInfo { endCursor hasNextPage } } }
    events { id actorId kind body createdAt }
  }
}
query TriageAssignees($inspectionId: ID!) { triageAssignees(inspectionId: $inspectionId) { id role current } }

query Schedules($after: String) { schedules(first: 25, after: $after) { nodes { id assetId participantId templateId rrule timezone startsAt nextDueAt deadlineMinutes reminderOffsetsMinutes status blockedReason blockedAt version } pageInfo { endCursor hasNextPage } } }
query Inspections($first: Int!, $after: String, $history: Boolean!, $search: String, $statusGroup: InspectionStatusGroup) { inspections(first: $first, after: $after, history: $history, search: $search, statusGroup: $statusGroup) { nodes { id assetId participantId projectId stageId source sourceReason stateReason status mediaKind comparisonMode referenceVersionId referenceVersionNumber referenceMediaKind referenceVersionStatus referenceIsActive evidenceCount dueAt deadlineAt reminderInstants version assetName assetAddress assetExternalKey participantName attention { kind mediaId replacementDeadlineAt since } } pageInfo { endCursor hasNextPage } } }
query InspectionDetail($id: ID!) { inspection(id: $id) { id assetId participantId projectId stageId source sourceReason stateReason status mediaKind comparisonMode referenceVersionId referenceVersionNumber referenceMediaKind referenceVersionStatus referenceIsActive evidenceCount dueAt deadlineAt reminderInstants version assetName assetAddress assetExternalKey participantName attention { kind mediaId replacementDeadlineAt since } } }
query SensitiveMediaReviews($first: Int!, $after: String) { sensitiveMediaReviews(first: $first, after: $after) { nodes { mediaId inspectionId assetName participantName mediaKind requirementKey blockedAt submitted sourceAvailable } pageInfo { endCursor hasNextPage } } }
query SensitiveMediaOriginal($mediaId: ID!) { sensitiveMediaOriginal(mediaId: $mediaId) { mediaId mediaKind url expiresAt } }
query InspectionVideoPreparation($mediaId: ID!) { videoPreparation(mediaId: $mediaId) { mediaId preparationVersion retryable sourceAvailable } }
mutation RetryInspectionVideoPreparation($input: RetryVideoPreparationInput!) { retryVideoPreparation(input: $input) { preparation { mediaId status preparationVersion } userErrors { code field message } clientMutationId } }
mutation DeclareSensitiveDetectionFalsePositive($input: SensitiveFalsePositiveInput!) { declareSensitiveDetectionFalsePositive(input: $input) { media { id status } userErrors { code field message } clientMutationId } }
query Projects($after: String) { projects(first: 25, after: $after) { nodes { id name orderedStages assetId status version stages { id key label kind position status plannedAt reason inspectionIds version } } pageInfo { endCursor hasNextPage } } }
query ProjectDetail($id: ID!) { project(id: $id) { id name orderedStages businessUnitId assetId status version stages { id key label kind position status plannedAt reason inspectionIds version } transitions { id stageId fromState toState reason occurredAt } } }
query ProjectTimeline($projectId: ID!) { projectTimeline(projectId: $projectId) { projectId entries { stageId label status inspectionIds occurredAt } } }
query ReportWorkspace($inspectionId: ID!, $version: Int) { report(inspectionId: $inspectionId, version: $version) { id inspectionId projectId version classification advisory pdfStatus context { asset { id name externalKey address } participant { id name } template { id name version } inspection { stageLabel } } inventory { referenceVersionNumber purpose coverage { expectedItems assessedItems notObserved environmentsNotCaptured environmentsAddedDuringCapture } problems { environment type name status conditionBefore conditionAfter reason pairs { originEvidenceId currentEvidenceId originSourceAvailability currentSourceAvailability timestampMs } } informational { environment type name status conditionBefore conditionAfter reason pairs { originEvidenceId currentEvidenceId originSourceAvailability currentSourceAvailability timestampMs } } } requirements { key section label instructions noRelevantChange analysisMode analysisStatus } evidence(first: 100) { nodes { id requirementKey role description capturedAt availability sourceAvailability evidenceKind timestampMs sourceMediaId component label flags url } pageInfo { endCursor hasNextPage } } findings { id category title description severity recommendedAction evidenceIds } } }
query Reports($first: Int!, $after: String, $search: String, $classification: String) { reports(first: $first, after: $after, search: $search, classification: $classification) { nodes { id inspectionId assetName assetAddress assetExternalKey participantName generatedAt classification version } pageInfo { endCursor hasNextPage } } }
query ReportDownload($snapshotId: ID!) { reportDownload(snapshotId: $snapshotId, kind: "PDF") { snapshotId kind objectKey url status sha256 } }

query CustomerPortfolio($after: String) { customerPortfolio(first: 25, after: $after) { nodes { assetId assetName assetExternalKey latestPublishedInspectionId projectId publishedClassification updatedAt } pageInfo { endCursor hasNextPage } } }
query CustomerTimeline($assetId: ID, $projectId: ID, $after: String) { customerTimeline(assetId: $assetId, projectId: $projectId, first: 25, after: $after) { nodes { id kind status occurredAt historical } pageInfo { endCursor hasNextPage } } }
query CustomerReport($inspectionId: ID!, $version: Int) { customerReport(inspectionId: $inspectionId, version: $version) { inspectionId snapshotId version classification advisory status historical context { asset { id name externalKey address } participant { id name } template { id name version } inspection { projectId stageId stageLabel dueAt submittedAt generatedAt } } inventory { referenceVersionNumber purpose coverage { expectedItems assessedItems notObserved environmentsNotCaptured environmentsAddedDuringCapture } problems { environment type name status conditionBefore conditionAfter reason pairs { originEvidenceId currentEvidenceId originSourceAvailability currentSourceAvailability timestampMs } } informational { environment type name status conditionBefore conditionAfter reason pairs { originEvidenceId currentEvidenceId originSourceAvailability currentSourceAvailability timestampMs } } } requirements { key section label instructions coverage impossibilityReason noRelevantChange analysisMode analysisStatus } } }
query CustomerEvidence($inspectionId: ID!, $mode: EvidenceMode!, $after: String) { customerEvidence(inspectionId: $inspectionId, mode: $mode, first: 25, after: $after) { nodes { id requirementKey section label role description captureSource capturedAt state lineageId replacedBy mediaAvailability sourceAvailability evidenceKind frameId timestampMs ptsMicros preparationId planId sourceMediaId component flags url } pageInfo { endCursor hasNextPage } } }
query MyNotifications($after: String, $unreadOnly: Boolean!, $kind: String, $projectId: ID) { myNotifications(first: 25, after: $after, unreadOnly: $unreadOnly, kind: $kind, projectId: $projectId) { nodes { id kind title body resourceKind resourceId createdAt readAt action context priority dueAt } unreadCount pageInfo { endCursor hasNextPage } } }
query NotificationDeliveries($after: String) {
  notificationDeliveries(first: 25, after: $after) {
    nodes {
      id intentId status aggregateStatus selectedProvider createdAt updatedAt
      channels { id channel status provider receiptId attempts lastAttemptAt createdAt updatedAt }
    }
    pageInfo { endCursor hasNextPage }
  }
}

