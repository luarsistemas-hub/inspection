mutation ActivateBaselineVersion($input: ActivateBaselineVersionInput!) { activateBaselineVersion(input: $input) { version { id status versionNumber purpose counts { included rejected notReviewed } } userErrors { code field message } clientMutationId } }
mutation DiscardBaselineDraft($input: DiscardBaselineDraftInput!) { discardBaselineDraft(input: $input) { version { id status } userErrors { code field message } clientMutationId } }
mutation RequestOriginCataloging($input: RequestOriginCatalogingInput!) { requestOriginCataloging(input: $input) { version { id status versionNumber draftState } userErrors { code field message } clientMutationId } }
mutation RetryInventoryDraft($input: RetryInventoryDraftInput!) { retryInventoryDraft(input: $input) { version { id status draftState } userErrors { code field message } clientMutationId } }
mutation StartBaselineDraftFromInspection($input: StartBaselineDraftFromInspectionInput!) { startBaselineDraftFromInspection(input: $input) { version { id status draftState } userErrors { code field message } clientMutationId } }
query InspectionOriginPromotion($inspectionId: ID!) { inspectionOriginPromotion(inspectionId: $inspectionId) { inspectionId eligible impediments { code message } activeOrigin { id versionNumber mediaKind hasInventory } conflictingDraft { id source sourceInspectionId draftState ownInspection } automaticCatalogSkipped confirmationDigest currentPromotion { id status purpose failureCode failureReason retryable originVersion { id versionNumber mediaKind hasInventory } supersededVersionId draftVersionId replacedDraftId requestedAt completedAt } generatedVersionActive } }
mutation PromoteInspectionToOrigin($input: PromoteInspectionToOriginInput!) { promoteInspectionToOrigin(input: $input) { clientMutationId promotion { id status purpose failureCode failureReason retryable originVersion { id versionNumber mediaKind hasInventory } supersededVersionId draftVersionId replacedDraftId requestedAt completedAt } originVersion { id versionNumber mediaKind hasInventory } userErrors { code field message correlationId } } }
