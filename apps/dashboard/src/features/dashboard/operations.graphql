mutation UpdateSchedule($input: UpdateScheduleInput!) { updateSchedule(input: $input) { schedule { id status nextDueAt version } userErrors { code field message correlationId } clientMutationId } }
mutation CancelSchedule($input: CancelScheduleInput!) { cancelSchedule(input: $input) { schedule { id status version } userErrors { code field message correlationId } clientMutationId } }
