query AdminIdentity { me { identityId tenantId roles productEntitlements memberships { id tenantId role status scopes { kind resourceId } } effectiveScopes { kind resourceId } } tenant { id name language defaultTimezone status version } }

query AdminGate { me { tenantId roles productEntitlements } tenant { id name status } }

mutation BootstrapTenant($input: CreateTenantInput!) { createTenant(input: $input) { tenant { id name status } userErrors { code field message correlationId } clientMutationId } }

query AdminOrganization($first: Int!, $after: String) { businessUnits(first: $first, after: $after) { nodes { id code name status version } pageInfo { endCursor hasNextPage } } }

query AdminAccess($first: Int!, $after: String) { memberships(first: $first, after: $after) { nodes { id role status version scopes { kind resourceId } } pageInfo { endCursor hasNextPage } } }

query AdminCatalogs($first: Int!, $after: String, $search: String) { participants(first: $first, after: $after, search: $search) { nodes { id name status version contacts { id channel value verified active } } pageInfo { endCursor hasNextPage } } segmentDefinitions(first: $first, after: $after, search: $search) { nodes { id key name activeVersionId version } pageInfo { endCursor hasNextPage } } templates(first: $first, after: $after, search: $search) { nodes { id key name segmentVersionId activeVersionId version } pageInfo { endCursor hasNextPage } } }

query AdminAssets($first: Int!, $after: String, $search: String) { assets(first: $first, after: $after, search: $search) { nodes { id name externalKey address status businessUnitId version } pageInfo { endCursor hasNextPage } } }

query AdminGovernance($first: Int!, $after: String) { publicationPolicy { mode version } retentionPolicies { nodes { id evidenceDays operationalDays securityDays version } pageInfo { endCursor hasNextPage } } notificationDeliveries(first: $first, after: $after) { nodes { id status createdAt updatedAt } pageInfo { endCursor hasNextPage } } }

query AdminAudit($first: Int!, $after: String) { auditEvents(first: $first, after: $after) { nodes { id action targetType targetId outcome reason correlationId occurredAt } pageInfo { endCursor hasNextPage } } usageSummary { from to requests inputTokens outputTokens cost } }

query AdminHistory($first: Int!, $after: String) { auditEvents(first: $first, after: $after) { nodes { id action targetType targetId outcome reason correlationId occurredAt } pageInfo { endCursor hasNextPage } } }

mutation AdminCreateBusinessUnit($input: CreateBusinessUnitInput!) { createBusinessUnit(input: $input) { businessUnit { id code name status version } userErrors { code field message correlationId } clientMutationId } }
mutation AdminInviteInternalUser($input: InviteInternalUserInput!) { inviteInternalUser(input: $input) { membership { id role status version scopes { kind resourceId } } userErrors { code field message correlationId } clientMutationId } }
mutation AdminUpsertParticipant($input: UpsertParticipantInput!) { upsertParticipant(input: $input) { participant { id name status version contacts { id channel value verified active } } userErrors { code field message correlationId } clientMutationId } }
mutation AdminRegisterAsset($input: RegisterAssetInput!) { registerAsset(input: $input) { asset { id name externalKey status version } userErrors { code field message correlationId } clientMutationId } }
mutation AdminConfigurePublicationPolicy($input: ConfigurePublicationPolicyInput!) { configurePublicationPolicy(input: $input) { policy { mode version } userErrors { code field message correlationId } clientMutationId } }
