query ExternalCaptureBootstrap {
  externalCapture {
    responsibilityId recaptureRequestId recaptureDeadlineAt replacementDeadlineAt status confirmationOnly kind mediaKind disclosureVersion captureLayout reference policy
    environments { requirementKey identityId typeCode name expected addedDuringCapture mediaCount status }
    reviewHandoff { inspectionId originVersionId }
    referenceItems { mediaId evidenceId sourceMediaId timestampMs environment component view ambiguous gap requirementKey description reason availability imageUrl imageUrlExpiresAt }
    requirements { key section label instructions required minimumMedia maximumMedia descriptionRequired captureSourcePolicy comparisonTarget impossibilityAllowed environmentIdentityId environmentTypeCode environmentName expected addedDuringCapture }
    answers { requirementKey mediaIds impossibilityReason version }
  }
}

mutation RequestInvitationOtp($input: RequestInvitationOtpInput!) { requestInvitationOtp(input: $input) { status userErrors { code field message correlationId } clientMutationId } }

mutation VerifyInvitationOtp($input: VerifyInvitationOtpInput!) { verifyInvitationOtp(input: $input) { status csrfToken expiresAt userErrors { code field message correlationId } clientMutationId } }

mutation AcceptProcessing($input: AcceptProcessingInput!) { acceptProcessing(input: $input) { status userErrors { code field message correlationId } clientMutationId } }

mutation RevokeInvitation($input: RevokeInvitationInput!) { revokeInvitation(input: $input) { status userErrors { code field message correlationId } clientMutationId } }

mutation CreateMediaUpload($input: CreateMediaUploadInput!) { createMediaUpload(input: $input) { upload { mediaId uploadId expiresAt partSizeBytes } userErrors { code field message correlationId } clientMutationId } }

mutation BeginVideoCapture($input: BeginVideoCaptureInput!) { beginVideoCapture(input: $input) { attempt { id kind acquisitionSource maxDurationSeconds maxBytes policyVersion admittedAt expiresAt status } userErrors { code field message correlationId } clientMutationId } }

query VideoUploadStatus($mediaId: ID!) { videoUploadStatus(mediaId: $mediaId) { mediaId status expiresAt receivedParts confirmedParts { partNumber etag sizeBytes } missingParts } }

query VideoPreparation($mediaId: ID!) { videoPreparation(mediaId: $mediaId) { mediaId stage errorCode retryable processedFrames sourceAvailable } }

mutation PresignMediaParts($input: PresignMediaPartsInput!) { presignMediaParts(input: $input) { parts { partNumber url expiresAt } userErrors { code field message correlationId } clientMutationId } }

mutation CompleteMediaUpload($input: CompleteMediaUploadInput!) { completeMediaUpload(input: $input) { media { id status } userErrors { code field message correlationId } clientMutationId } }

mutation SaveCaptureMetadata($input: SaveCaptureMetadataInput!) { saveCaptureMetadata(input: $input) { media { id status replacesMediaId } userErrors { code field message correlationId } clientMutationId } }

mutation DeclareCaptureImpossibility($input: DeclareCaptureImpossibilityInput!) { declareCaptureImpossibility(input: $input) { status userErrors { code field message correlationId } clientMutationId } }

mutation DeclareCaptureEnvironment($input: DeclareCaptureEnvironmentInput!) { declareCaptureEnvironment(input: $input) { environment { requirementKey identityId typeCode name expected addedDuringCapture mediaCount status } userErrors { code field message correlationId } clientMutationId } }

mutation RecordCaptureQualityWarning($input: RecordCaptureQualityWarningInput!) { recordCaptureQualityWarning(input: $input) { flags userErrors { code field message correlationId } clientMutationId } }


mutation SubmitCapture($input: SubmitCaptureInput!) { submitCapture(input: $input) { submission { id complete requiresAttention submittedAt } userErrors { code field message correlationId } clientMutationId } }

mutation SubmitRecapture($input: SubmitRecaptureInput!) { submitRecapture(input: $input) { recapture { id status } userErrors { code field message correlationId } clientMutationId } }

query CounterpartyBaseline { counterpartyBaseline { deadlineAt response respondedAt resolution resolutionReason adjustmentStatus newerVersionExists readOnly baseline { hasInventory environments { typeCode name items { typeCode name material color quantity condition observation limitation evidence { kind position } } } } } }

mutation RequestCounterpartyOtp($input: RequestCounterpartyOtpInput!) { requestCounterpartyOtp(input: $input) { status userErrors { code field message correlationId } clientMutationId } }

mutation VerifyCounterpartyOtp($input: VerifyCounterpartyOtpInput!) { verifyCounterpartyOtp(input: $input) { status csrfToken expiresAt userErrors { code field message correlationId } clientMutationId } }

mutation AcknowledgeBaseline($input: CounterpartyResponseInput!) { acknowledgeBaseline(input: $input) { response respondedAt userErrors { code field message correlationId } clientMutationId } }

mutation ContestBaseline($input: ContestBaselineInput!) { contestBaseline(input: $input) { response respondedAt userErrors { code field message correlationId } clientMutationId } }
