name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspection
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - run: go run github.com/99designs/gqlgen@v0.17.95 generate
        working-directory: services/inspection
      - run: git diff --exit-code
      - run: test -z "$(gofmt -l services/inspection libs)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: ./scripts/validate-compozy-tasks.sh
  design-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/inspection-design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/inspection-design-system/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [admin, dashboard, capture]
    defaults:
      run:
        working-directory: apps/${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.product }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run codegen:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts-${{ matrix.product }}
          path: |
            apps/${{ matrix.product }}/playwright-report
            apps/${{ matrix.product }}/test-results

  e2e-parity:
    runs-on: ubuntu-latest
    needs: [go, design-system, frontend]
    env:
      INSPECTION_E2E_AUTH: "true"
      INSPECTION_E2E_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_E2E_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      INSPECTION_SEED_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SEED_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_USERNAME }}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_PASSWORD }}
      INSPECTION_SUPER_ADMIN_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SUPER_ADMIN_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure isolated test environment
        run: cp .env.example .env.inspection
      - name: Start and seed parity stack
        run: |
          ./scripts/local.sh up
          ./scripts/local.sh seed
      - name: Install browser dependencies
        run: |
          for product in admin dashboard capture; do
            (cd "apps/$product" && npm ci && npx playwright install --with-deps chromium webkit)
          done
      - name: Run authenticated Playwright suites
        env:
          CI: ""
        run: |
          status=0
          for product in admin dashboard capture; do
            (cd "apps/$product" && npm run test:e2e) || status=$?
          done
          exit "$status"
      - name: Upload parity browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-e2e-parity-artifacts
          if-no-files-found: warn
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
            apps/dashboard/playwright-report
            apps/dashboard/test-results
            apps/capture/playwright-report
            apps/capture/test-results
      - name: Capture stack logs
        if: always()
        run: docker compose --env-file .env.inspection -f deploy/docker-compose.yml logs --no-color > e2e-parity-compose.log || true
      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-e2e-parity-stack-logs
          path: e2e-parity-compose.log
          if-no-files-found: warn
      - name: Tear down isolated parity stack
        if: always()
        run: docker compose --env-file .env.inspection -f deploy/docker-compose.yml down --volumes --remove-orphans

  cross-product:
    runs-on: ubuntu-latest
    needs: [go, design-system, frontend, e2e-parity]
    env:
      INSPECTION_E2E_AUTH: "true"
      INSPECTION_E2E_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_E2E_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      INSPECTION_SEED_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SEED_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_USERNAME }}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_PASSWORD }}
      INSPECTION_SUPER_ADMIN_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SUPER_ADMIN_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate cross-product gate inputs
        run: |
          set -eu
          test -f apps/dashboard/tests/e2e/recapture-cross-product.spec.ts
          test -f scripts/lib/parity-evidence.mjs
          test -f scripts/lib/legacy-inventory.mjs
      - name: Validate compose and task contracts
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          ./scripts/validate-compozy-tasks.sh
      - name: Start and seed isolated cross-product stack
        run: |
          cp .env.example .env.inspection
          ./scripts/local.sh up
          ./scripts/local.sh seed
      - name: Install cross-product browser dependencies
        run: |
          for product in dashboard capture; do
            (cd "apps/$product" && npm ci && npx playwright install --with-deps chromium)
          done
      - name: Run Dashboard to Capture recapture journey
        working-directory: apps/dashboard
        run: npx playwright test tests/e2e/recapture-cross-product.spec.ts
      - name: Generate and validate cross-product evidence
        run: |
          node scripts/lib/parity-evidence.mjs generate \
            --journey E2E-027 \
            --input apps/dashboard/test-results \
            --output artifacts/cross-product/evidence
          node scripts/lib/parity-evidence.mjs validate \
            --input artifacts/cross-product/evidence
      - name: Validate legacy inventory with drift checks
        run: |
          node scripts/lib/legacy-inventory.mjs generate \
            --legacy-root apps/web \
            --output artifacts/cross-product/legacy-inventory.json
          node scripts/lib/legacy-inventory.mjs validate \
            --input artifacts/cross-product/legacy-inventory.json \
            --fail-on-unclassified \
            --fail-on-drift
      - name: Upload cross-product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-product-evidence
          if-no-files-found: warn
          path: |
            artifacts/cross-product
            apps/dashboard/playwright-report
            apps/dashboard/test-results
            apps/capture/playwright-report
            apps/capture/test-results
      - name: Tear down isolated cross-product stack
        if: always()
        run: docker compose --env-file .env.inspection -f deploy/docker-compose.yml down --volumes --remove-orphans
