name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspection
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
          cache: true
      - run: go run github.com/99designs/gqlgen@v0.17.95 generate
        working-directory: services/inspection
      - run: git diff --exit-code
      - run: test -z "$(gofmt -l services/inspection libs)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Validate local compose configuration
        run: |
          export KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=ci
          export KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=ci
          export INSPECTION_SUPER_ADMIN_USERNAME=ci
          export INSPECTION_SUPER_ADMIN_PASSWORD=ci
          docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet
      - run: ./scripts/validate-compozy-tasks.sh
      - name: Validate OCI deployment code
        run: |
          set -euo pipefail
          bash -n deploy/oci/ops.sh deploy/oci/host/*.sh
          python3 -m unittest discover -s deploy/oci/tests -v
          docker compose --env-file deploy/oci/compose.env.example -f deploy/oci/compose.yaml config --quiet
          python3 -m py_compile deploy/oci/affected.py deploy/oci/planner.py deploy/oci/verify-release.py
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Validate OCI Terraform
        run: |
          set -euo pipefail
          for stack in foundation runtime; do
            terraform -chdir="deploy/oci/$stack" fmt -check -recursive
            terraform -chdir="deploy/oci/$stack" init -backend=false -input=false
            terraform -chdir="deploy/oci/$stack" validate
          done
      - run: node --test scripts/lib/parity-tools.test.mjs scripts/lib/design-system-migration.test.mjs
      - name: Validate design-system migration inventory
        run: node scripts/lib/design-system-migration.mjs validate --inventory docs/design-system/migration-inventory.json
  design-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/inspection-design-system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/inspection-design-system/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run pack:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [admin, dashboard, capture, onboarding]
    defaults:
      run:
        working-directory: apps/${{ matrix.product }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.product }}/package-lock.json
      - run: npm ci
      - run: node ../../scripts/prepare-design-system.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run codegen:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-artifacts-${{ matrix.product }}
          path: |
            apps/${{ matrix.product }}/playwright-report
            apps/${{ matrix.product }}/test-results

  e2e-parity:
    runs-on: ubuntu-latest
    needs: [go, design-system, frontend]
    env:
      INSPECTION_E2E_AUTH: "true"
      INSPECTION_E2E_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_E2E_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      INSPECTION_SEED_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SEED_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_USERNAME }}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_PASSWORD }}
      INSPECTION_SUPER_ADMIN_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SUPER_ADMIN_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Configure isolated test environment
        run: cp .env.example .env.inspection
      - name: Start and seed parity stack
        run: |
          ./scripts/local.sh up
          ./scripts/local.sh seed
      - name: Install browser dependencies
        run: |
          for product in admin dashboard capture onboarding; do
            (cd "apps/$product" && npm ci && npx playwright install --with-deps chromium webkit)
          done
      - name: Run authenticated Playwright suites
        env:
          CI: ""
        run: |
          status=0
          for product in admin dashboard capture onboarding; do
            (cd "apps/$product" && npm run test:e2e) || status=$?
          done
          exit "$status"
      - name: Upload parity browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authenticated-e2e-parity-artifacts
          if-no-files-found: warn
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
            apps/dashboard/playwright-report
            apps/dashboard/test-results
            apps/capture/playwright-report
            apps/capture/test-results
            apps/onboarding/playwright-report
            apps/onboarding/test-results
      - name: Capture stack logs
        if: always()
        run: docker compose --env-file .env.inspection -f deploy/docker-compose.yml logs --no-color > e2e-parity-compose.log || true
      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authenticated-e2e-parity-stack-logs
          path: e2e-parity-compose.log
          if-no-files-found: warn
      - name: Tear down isolated parity stack
        if: always()
        run: docker compose --env-file .env.inspection -f deploy/docker-compose.yml down --volumes --remove-orphans

  cross-product:
    runs-on: ubuntu-latest
    needs: [go, design-system, frontend, e2e-parity]
    env:
      INSPECTION_E2E_AUTH: "true"
      INSPECTION_E2E_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_E2E_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      INSPECTION_SEED_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SEED_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_USERNAME }}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.INSPECTION_KEYCLOAK_BOOTSTRAP_PASSWORD }}
      INSPECTION_SUPER_ADMIN_USERNAME: ${{ secrets.INSPECTION_E2E_USERNAME }}
      INSPECTION_SUPER_ADMIN_PASSWORD: ${{ secrets.INSPECTION_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate cross-product gate inputs
        run: |
          set -eu
          test "${INSPECTION_E2E_AUTH}" = "true"
          test -n "${INSPECTION_E2E_USERNAME}"
          test -n "${INSPECTION_E2E_PASSWORD}"
          test -n "${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}"
          test -n "${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}"
          test -f apps/dashboard/tests/e2e/recapture-cross-product.spec.ts
          test -f apps/admin/tests/e2e/activation.spec.ts
          test -f apps/dashboard/tests/e2e/design-system-cross-product.spec.ts
          node scripts/lib/design-system-migration.mjs prerequisites --repository .
          node scripts/lib/design-system-migration.mjs validate --repository . --inventory docs/design-system/migration-inventory.json
          test -f scripts/lib/parity-evidence.mjs
          test -f scripts/lib/legacy-inventory.mjs
      - name: Configure isolated test environment
        run: cp .env.example .env.inspection
      - name: Validate compose and task contracts
        run: |
          docker compose --env-file .env.inspection -f deploy/docker-compose.yml config --quiet
          ./scripts/validate-compozy-tasks.sh
      - name: Start and seed isolated cross-product stack
        run: |
          ./scripts/local.sh up
          ./scripts/local.sh seed
      - name: Install cross-product browser dependencies
        run: |
          for product in dashboard capture onboarding; do
            (cd "apps/$product" && npm ci && npx playwright install --with-deps chromium)
          done
      - name: Run Dashboard to Capture recapture journey
        working-directory: apps/dashboard
        run: npx playwright test tests/e2e/recapture-cross-product.spec.ts
      - name: Generate and validate cross-product evidence
        run: |
          node scripts/lib/parity-evidence.mjs generate \
            --journey E2E-027 \
            --input apps/dashboard/test-results \
            --output artifacts/cross-product/evidence
          node scripts/lib/parity-evidence.mjs validate \
            --input artifacts/cross-product/evidence
      - name: Validate legacy inventory with drift checks
        run: |
          node scripts/lib/legacy-inventory.mjs generate \
            --legacy-root apps/web \
            --output artifacts/cross-product/legacy-inventory.json
          node scripts/lib/legacy-inventory.mjs validate \
            --input artifacts/cross-product/legacy-inventory.json \
            --baseline docs/legacy-inventory.json \
            --fail-on-unclassified \
            --fail-on-drift
      - name: Upload cross-product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-product-evidence
          if-no-files-found: warn
          path: |
            artifacts/cross-product
            apps/dashboard/playwright-report
            apps/dashboard/test-results
            apps/capture/playwright-report
            apps/capture/test-results
      - name: Tear down isolated cross-product stack
        if: always()
        run: docker compose --env-file .env.inspection -f deploy/docker-compose.yml down --volumes --remove-orphans

  ci-required:
    if: always()
    needs: [go, design-system, frontend, e2e-parity, cross-product]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI validation
        env:
          GO_RESULT: ${{ needs.go.result }}
          DESIGN_SYSTEM_RESULT: ${{ needs.design-system.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e-parity.result }}
          CROSS_PRODUCT_RESULT: ${{ needs.cross-product.result }}
        run: |
          set -euo pipefail
          for result in "$GO_RESULT" "$DESIGN_SYSTEM_RESULT" "$FRONTEND_RESULT" "$E2E_RESULT" "$CROSS_PRODUCT_RESULT"; do
            [[ "$result" == success ]] || { echo "Required validation did not succeed: $result" >&2; exit 1; }
          done
