name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspection
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
          cache: true
      - name: Generate GraphQL contracts
        run: ./scripts/generate-graphql-contracts.sh
      - run: git diff --exit-code
      - run: test -z "$(gofmt -l services/inspection libs)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Validate local compose configuration
        run: |
          export KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=ci
          export KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=ci
          export INSPECTION_SUPER_ADMIN_USERNAME=ci
          export INSPECTION_SUPER_ADMIN_PASSWORD=ci
          docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet
      - run: ./scripts/validate-compozy-tasks.sh
      - name: Validate OCI deployment code
        run: |
          set -euo pipefail
          for script in deploy/oci/ops.sh deploy/oci/host/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy/oci/tests -v
          docker compose --env-file deploy/oci/compose.env.example -f deploy/oci/compose.yaml config --quiet
          python3 -m py_compile deploy/oci/affected.py deploy/oci/planner.py deploy/oci/verify-release.py
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Validate OCI Terraform
        run: |
          set -euo pipefail
          for stack in foundation runtime; do
            terraform -chdir="deploy/oci/$stack" fmt -check -recursive
            terraform -chdir="deploy/oci/$stack" init -backend=false -input=false
            terraform -chdir="deploy/oci/$stack" validate
          done
      - run: node --test scripts/lib/parity-tools.test.mjs scripts/lib/design-system-migration.test.mjs
      - name: Validate design-system migration inventory
        run: node scripts/lib/design-system-migration.mjs validate --inventory docs/design-system/migration-inventory.json
  design-system:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/inspection-design-system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/inspection-design-system/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run pack:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product: [admin, dashboard, capture, onboarding]
    defaults:
      run:
        working-directory: apps/${{ matrix.product }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.product }}/package-lock.json
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.product }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.product)) }}
      - run: npm ci
      - run: node ../../scripts/prepare-design-system.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run codegen:check
      - run: npm run lint
      - run: npm run test
      - name: Configure Capture build endpoints
        if: matrix.product == 'capture'
        run: |
          {
            echo "NEXT_PUBLIC_INSPECTION_API_URL=http://localhost:3113/graphql"
            echo "NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3002"
          } >> "$GITHUB_ENV"
      - name: Configure Onboarding build Turnstile test key
        if: matrix.product == 'onboarding'
        run: echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> "$GITHUB_ENV"
      - name: Build frontend with mocked OIDC endpoints
        env:
          NEXT_PUBLIC_OIDC_AUTHORIZE_URL: http://localhost:8081/realms/inspection/protocol/openid-connect/auth
          NEXT_PUBLIC_OIDC_TOKEN_URL: http://localhost:8081/realms/inspection/protocol/openid-connect/token
        run: npm run build
      - name: Install required Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.product == 'capture' && 'webkit' || matrix.product == 'onboarding' && 'chromium webkit' || 'chromium' }}
      - name: Run required Admin mocked journeys
        if: matrix.product == 'admin'
        env:
          INSPECTION_E2E_MOCKS: 'true'
        run: npx playwright test tests/e2e/admin-mocked-integration.spec.ts --project=chromium
      - name: Run required Dashboard mocked journeys
        if: matrix.product == 'dashboard'
        env:
          INSPECTION_E2E_MOCKS: 'true'
        run: npx playwright test tests/e2e/design-system-migration.spec.ts --project=chromium
      - name: Run Capture production journeys in WebKit
        if: matrix.product == 'capture'
        run: npx playwright test tests/e2e/design-system-migration.spec.ts --project=webkit-iphone
      - name: Run Onboarding viewport journeys
        if: matrix.product == 'onboarding'
        run: npx playwright test tests/e2e/design-system-migration.spec.ts --project=viewport-320 --project=viewport-360 --project=viewport-768 --project=desktop-1440
  ci-required:
    if: ${{ !cancelled() }}
    needs: [go, design-system, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI validation
        env:
          GO_RESULT: ${{ needs.go.result }}
          DESIGN_SYSTEM_RESULT: ${{ needs.design-system.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          for result in "$GO_RESULT" "$DESIGN_SYSTEM_RESULT" "$FRONTEND_RESULT"; do
            [[ "$result" == success ]] || { echo "Required validation did not succeed: $result" >&2; exit 1; }
          done
