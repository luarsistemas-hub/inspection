name: OCI ARM64 images

on:
  workflow_dispatch:
    inputs:
      release:
        description: Full 40-character commit SHA to build and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      - name: Require a commit SHA
        env:
          RELEASE: ${{ inputs.release }}
        run: '[[ "$RELEASE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
      - run: test -z "$(gofmt -l services/inspection libs)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Validate local compose configuration
        run: |
          export KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=ci
          export KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=ci
          export INSPECTION_SUPER_ADMIN_USERNAME=ci
          export INSPECTION_SUPER_ADMIN_PASSWORD=ci
          docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet
      - run: docker compose --env-file deploy/oci/compose.env.example -f deploy/oci/compose.yaml config --quiet

  frontend-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [admin, dashboard, capture, onboarding]
    defaults:
      run:
        working-directory: apps/${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.product }}/package-lock.json
      - run: npm ci
      - run: node ../../scripts/prepare-design-system.mjs
      - run: npm audit --audit-level=high
      - run: npm run codegen:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  publish:
    needs: [validate, frontend-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Inspection service
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inspection/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/inspection-api:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=oci-api
          cache-to: type=gha,mode=max,scope=oci-api
      - name: Publish Keycloak
        id: keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/oci/Dockerfile.keycloak
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/inspection-keycloak:${{ steps.meta.outputs.sha }}
      - name: Publish frontends
        shell: bash
        env:
          RELEASE: ${{ steps.meta.outputs.sha }}
          IMAGE_REGISTRY: ghcr.io/${{ steps.meta.outputs.owner }}
          ADMIN_ORIGIN: ${{ vars.OCI_ADMIN_ORIGIN }}
          DASHBOARD_ORIGIN: ${{ vars.OCI_DASHBOARD_ORIGIN }}
          CAPTURE_ORIGIN: ${{ vars.OCI_CAPTURE_ORIGIN }}
          ONBOARDING_ORIGIN: ${{ vars.OCI_ONBOARDING_ORIGIN }}
          API_ORIGIN: ${{ vars.OCI_API_ORIGIN }}
          AUTH_ORIGIN: ${{ vars.OCI_AUTH_ORIGIN }}
          STORAGE_ORIGIN: ${{ vars.OCI_STORAGE_ORIGIN }}
          TURNSTILE_SITE_KEY: ${{ vars.OCI_TURNSTILE_SITE_KEY }}
          OWNER: ${{ steps.meta.outputs.owner }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          KEYCLOAK_DIGEST: ${{ steps.keycloak.outputs.digest }}
        run: |
          set -euo pipefail
          for value in "$ADMIN_ORIGIN" "$DASHBOARD_ORIGIN" "$CAPTURE_ORIGIN" "$ONBOARDING_ORIGIN" "$API_ORIGIN" "$AUTH_ORIGIN" "$STORAGE_ORIGIN" "$TURNSTILE_SITE_KEY"; do
            test -n "$value"
          done
          owner="$OWNER"
          IMAGE_REGISTRY="ghcr.io/${owner}"
          declare -A image_digests
          assert_arm64() {
            local reference="$1" manifest
            manifest="$(docker buildx imagetools inspect --raw "$reference")"
            printf '%s' "$manifest" | jq -e '([.manifests[]?.platform? | select(.os == "linux" and .architecture == "arm64")] | length) > 0 or (.os == "linux" and .architecture == "arm64")' >/dev/null || {
              echo "Image has no linux/arm64 manifest: $reference" >&2
              return 1
            }
          }
          assert_arm64 "${IMAGE_REGISTRY}/inspection-api@${API_DIGEST}"
          assert_arm64 "${IMAGE_REGISTRY}/inspection-keycloak@${KEYCLOAK_DIGEST}"
          for product in admin dashboard capture onboarding; do
            args=(--file "apps/${product}/Dockerfile" --tag "${IMAGE_REGISTRY}/inspection-${product}:${RELEASE}" --push --platform linux/arm64)
            case "$product" in
              admin) args+=(--build-arg "NEXT_PUBLIC_INSPECTION_API_URL=${API_ORIGIN}/graphql" --build-arg "NEXT_PUBLIC_OIDC_AUTHORIZE_URL=${AUTH_ORIGIN}/realms/inspection/protocol/openid-connect/auth" --build-arg "NEXT_PUBLIC_OIDC_TOKEN_URL=${AUTH_ORIGIN}/realms/inspection/protocol/openid-connect/token" --build-arg NEXT_PUBLIC_OIDC_CLIENT_ID=inspection-admin --build-arg "NEXT_PUBLIC_DASHBOARD_URL=${DASHBOARD_ORIGIN}" --build-arg "NEXT_PUBLIC_CAPTURE_URL=${CAPTURE_ORIGIN}" --build-arg STAGE=production) ;;
              dashboard) args+=(--build-arg "NEXT_PUBLIC_INSPECTION_API_URL=${API_ORIGIN}/graphql" --build-arg "NEXT_PUBLIC_OIDC_AUTHORIZE_URL=${AUTH_ORIGIN}/realms/inspection/protocol/openid-connect/auth" --build-arg "NEXT_PUBLIC_OIDC_TOKEN_URL=${AUTH_ORIGIN}/realms/inspection/protocol/openid-connect/token" --build-arg NEXT_PUBLIC_OIDC_CLIENT_ID=inspection-dashboard --build-arg "NEXT_PUBLIC_ADMIN_URL=${ADMIN_ORIGIN}" --build-arg "NEXT_PUBLIC_STORAGE_URL=${STORAGE_ORIGIN}") ;;
              capture) args+=(--build-arg "NEXT_PUBLIC_INSPECTION_API_URL=${API_ORIGIN}/graphql" --build-arg "NEXT_PUBLIC_STORAGE_URL=${STORAGE_ORIGIN}" --build-arg NEXT_PUBLIC_CAPTURE_IMAGE_OPTIMIZATION=false) ;;
              onboarding) args+=(--build-arg "NEXT_PUBLIC_INSPECTION_API_URL=${API_ORIGIN}/graphql" --build-arg "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}") ;;
            esac
            metadata="/tmp/${product}-metadata.json"
            docker buildx build "${args[@]}" --metadata-file "$metadata" .
            image_digests[$product]="$(jq -er '.["containerimage.digest"]' "$metadata")"
            assert_arm64 "${IMAGE_REGISTRY}/inspection-${product}@${image_digests[$product]}"
          done
          registry_images=("postgres:18-alpine" "docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2" "rabbitmq:4.1.3-management-alpine" "caddy:2.10-alpine")
          upstream_names=(POSTGRES DRAGONFLY RABBITMQ CADDY)
          for index in "${!registry_images[@]}"; do
            manifest="$(docker buildx imagetools inspect --raw "${registry_images[$index]}")"
            printf '%s' "$manifest" | jq -e '([.manifests[]?.platform? | select(.os == "linux" and .architecture == "arm64")] | length) > 0 or (.os == "linux" and .architecture == "arm64")' >/dev/null || {
              echo "Upstream image has no linux/arm64 manifest: ${registry_images[$index]}" >&2
              exit 1
            }
            digest="sha256:$(printf '%s' "$manifest" | sha256sum | awk '{print $1}')"
            image_digests[${upstream_names[$index]}]="$digest"
          done
          owner="${owner}"
          mkdir -p deploy/oci/releases
          release_file="deploy/oci/releases/${RELEASE}.env"
          cat > "$release_file" <<EOF
          RELEASE_SHA=${RELEASE}
          API_IMAGE=ghcr.io/${owner}/inspection-api@${API_DIGEST}
          KEYCLOAK_IMAGE=ghcr.io/${owner}/inspection-keycloak@${KEYCLOAK_DIGEST}
          ADMIN_IMAGE=ghcr.io/${owner}/inspection-admin@${image_digests[admin]}
          DASHBOARD_IMAGE=ghcr.io/${owner}/inspection-dashboard@${image_digests[dashboard]}
          CAPTURE_IMAGE=ghcr.io/${owner}/inspection-capture@${image_digests[capture]}
          ONBOARDING_IMAGE=ghcr.io/${owner}/inspection-onboarding@${image_digests[onboarding]}
          POSTGRES_IMAGE=docker.io/library/postgres@${image_digests[POSTGRES]}
          DRAGONFLY_IMAGE=docker.dragonflydb.io/dragonflydb/dragonfly@${image_digests[DRAGONFLY]}
          RABBITMQ_IMAGE=docker.io/library/rabbitmq@${image_digests[RABBITMQ]}
          CADDY_IMAGE=docker.io/library/caddy@${image_digests[CADDY]}
          NEXT_PUBLIC_INSPECTION_API_URL=${API_ORIGIN}/graphql
          NEXT_PUBLIC_OIDC_AUTHORIZE_URL=${AUTH_ORIGIN}/realms/inspection/protocol/openid-connect/auth
          NEXT_PUBLIC_OIDC_TOKEN_URL=${AUTH_ORIGIN}/realms/inspection/protocol/openid-connect/token
          NEXT_PUBLIC_DASHBOARD_URL=${DASHBOARD_ORIGIN}
          NEXT_PUBLIC_ADMIN_URL=${ADMIN_ORIGIN}
          NEXT_PUBLIC_CAPTURE_URL=${CAPTURE_ORIGIN}
          NEXT_PUBLIC_STORAGE_URL=${STORAGE_ORIGIN}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
          NEXT_PUBLIC_CAPTURE_IMAGE_OPTIMIZATION=false
          EOF
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          mkdir -p "$staging/deploy"
          cp -R deploy/oci "$staging/deploy/oci"
          rm -rf "$staging/deploy/oci/releases" "$staging/deploy/oci/foundation/.terraform" "$staging/deploy/oci/runtime/.terraform"
          find "$staging" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$staging" -type f -name '*.pyc' -delete
          find "$staging/deploy/oci" -type f \( -name '*.tfstate' -o -name '*.tfstate.*' -o -name '*.tfvars' -o -name '*.tfvars.json' -o -name '*.plan' -o -name '*.env' -o -name '.env' -o -name 'secrets.map' \) -delete
          cp -R deploy/keycloak "$staging/deploy/keycloak"
          tar -czf "deploy/oci/releases/${RELEASE}-bundle.tgz" -C "$staging" deploy
      - name: Upload immutable deployment release
        uses: actions/upload-artifact@v4
        with:
          name: inspection-oci-release-${{ steps.meta.outputs.sha }}
          path: |
            deploy/oci/releases/${{ steps.meta.outputs.sha }}.env
            deploy/oci/releases/${{ steps.meta.outputs.sha }}-bundle.tgz
          if-no-files-found: error
