name: Roll back production components

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Deployment ID whose image composition should be restored
        required: true
        type: string
      targets:
        description: Comma-separated components to restore from that deployment
        required: true
        type: string
      dry_run:
        description: Create and display the rollback plan without applying it
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  rollback:
    uses: ./.github/workflows/publish.yml
    with:
      operation: rollback
      deployment_id: ${{ inputs.deployment_id }}
      targets: ${{ inputs.targets }}
      scope: selected
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
